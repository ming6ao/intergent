[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intergent"
version = "0.2.0"
description = "Coordination for parallel coding agents: campaign DAG, git worktrees, scope leases, verified integration."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
intergent = "intergent.cli:main"
ig = "intergent.cli:main"

[tool.setuptools]
packages = ["intergent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
